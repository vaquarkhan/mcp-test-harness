# Quick = every PR (seconds). Full = main branch + manual (installs all deps).
# Dist smoke = Docker / PyInstaller / Action / provider shims (--version / try).
name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: Quick (no MCP-Bastion / no torch)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install harness runtime + test deps (matches core deps, not Bastion)
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0.0,<2" "pyyaml>=6.0" "jsonschema>=4.0" "anyio>=4.0" "httpx>=0.27.0" pytest pytest-asyncio coverage
      - name: Offline pyproject checks
        run: python -m pytest tests/test_pyproject.py -q
      - name: All harness unit tests + 100% coverage gate
        run: |
          coverage run -m pytest tests/ --ignore=tests/test_workspace.py -q
          coverage report --fail-under=100

  full:
    name: Full (all dependencies + all tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install everything
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify dependency imports
        run: python scripts/verify_upstream.py
      - name: All tests + 100% coverage gate
        run: |
          coverage run -m pytest tests/ -q
          coverage report --fail-under=100
      - name: Verify mcp-test CLI
        run: mcp-test --version

  dist-smoke:
    name: Distribution smoke (Docker, binary, Action, providers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: GHCR image --version
        run: |
          docker pull ghcr.io/vaquarkhan/mcp-test-harness:latest
          docker run --rm ghcr.io/vaquarkhan/mcp-test-harness:latest --version

      - name: Install for binary build + provider smoke
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: PyInstaller binary --version
        run: |
          python scripts/build_binary.py
          ./dist/mcp-test --version

      - name: Provider shim imports (sample of 22)
        # Install from this checkout — PyPI may not have the bumped version yet (pre-tag / pre-publish).
        run: |
          pip install \
            ./packages/mcp-test-harness-openai \
            ./packages/mcp-test-harness-fastmcp \
            ./packages/mcp-test-harness-langchain
          python -c "import mcp_test_harness_openai, mcp_test_harness_fastmcp, mcp_test_harness_langchain, mcp_test_harness_langgraph, mcp_test_harness_pydantic_ai, mcp_test_harness_openai_agents; print('provider shims ok')"

      - name: Action-equivalent try-mode against fixture
        # Same smoke as the composite Action, but use the editable checkout install — PyPI may not have 4.0.0 yet.
        run: |
          mcp-test try --server-command "python ${{ github.workspace }}/tests/fixtures/minimal_mcp_server.py"
