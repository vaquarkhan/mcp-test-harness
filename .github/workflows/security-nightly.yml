# Reserved markers: detection-quality (semantic_live) and adaptive-attack trends.
# These must NOT gate PRs. Gated Suite A packs use @pytest.mark.security in validate.yml.
#
# Until suites exist under those markers, pytest exits 5 (no tests collected) — treat as success.
name: security-nightly

on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reserved-markers:
    name: semantic_live / adaptive (manual + nightly, not PR gate)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0.0,<2" "pyyaml>=6.0" "jsonschema>=4.0" "anyio>=4.0" "httpx>=0.27.0" "pytest>=7,<10" "pytest-asyncio>=0.21,<2"
      - name: Run reserved markers (allow empty collection)
        run: |
          set +e
          python -m pytest -m "semantic_live or adaptive" -q --tb=short
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "Reserved-marker suites passed."
            exit 0
          fi
          if [ "$code" -eq 5 ]; then
            echo "No semantic_live/adaptive tests collected yet — markers are reserved (manual/nightly only)."
            exit 0
          fi
          echo "Reserved-marker run failed with exit $code"
          exit "$code"
