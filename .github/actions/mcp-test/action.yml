name: "MCP Test Harness"
description: "Run MCP server tests and emit RFC-002 conformance level (badge-ready) for PR checks"
author: "Vaquar Khan"

branding:
  icon: check-circle
  color: green

inputs:
  server-command:
    description: "Shell command to start the MCP server under test"
    required: false
    default: ""
  transport:
    description: "Transport type: stdio, sse, or http"
    required: false
    default: "stdio"
  test-directory:
    description: "Path to the test directory or file"
    required: false
    default: "tests/"
  config-file:
    description: "Path to mcp-test.yaml or mcp-test.toml config file"
    required: false
    default: ""
  report-format:
    description: "Reserved; Action always writes JSON for conformance outputs (json recommended)"
    required: false
    default: "json"
  harness-version:
    description: "Version of mcp-test-harness to install (e.g. 5.0.0). Defaults to latest."
    required: false
    default: "latest"
  sarif-output:
    description: "Optional path for SARIF security findings"
    required: false
    default: ""
  pr-comment:
    description: "Post run summary (including conformance level) as a PR comment"
    required: false
    default: "false"
  try-mode:
    description: "If true, run mcp-test try (zero-config conformance) instead of suite tests"
    required: false
    default: "false"
  try-suite:
    description: "When try-mode is true, optional experiment suite (e.g. core)"
    required: false
    default: ""

outputs:
  test-result:
    description: "Test result: pass or fail"
    value: ${{ steps.run-tests.outputs.test-result }}
  conformance-level:
    description: "RFC-002 conformance level name"
    value: ${{ steps.run-tests.outputs.conformance-level }}
  conformance-level-num:
    description: "Numeric conformance level (-1 to 4)"
    value: ${{ steps.run-tests.outputs.conformance-level-num }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install MCP Test Harness
      shell: bash
      env:
        HARNESS_VERSION: ${{ inputs.harness-version }}
      run: |
        python -m pip install --upgrade pip
        if [ "$HARNESS_VERSION" = "latest" ]; then
          pip install mcp-test-harness
        else
          pip install "mcp-test-harness==$HARNESS_VERSION"
        fi

    - name: Run MCP tests
      id: run-tests
      shell: bash
      env:
        INPUT_SERVER_COMMAND: ${{ inputs.server-command }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_TEST_DIRECTORY: ${{ inputs.test-directory }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_TRY_MODE: ${{ inputs.try-mode }}
        INPUT_TRY_SUITE: ${{ inputs.try-suite }}
      run: |
        set +e
        JSON_REPORT="mcp-test-report.json"
        EXIT_CODE=0
        # Always emit JSON so conformance-level outputs stay extractable.
        FMT="json"
        OUT="$JSON_REPORT"

        if [ "$INPUT_TRY_MODE" = "true" ]; then
          TRY_ARGS=(try --transport "$INPUT_TRANSPORT" --report-format json --report-output "$JSON_REPORT")
          [ -n "$INPUT_SERVER_COMMAND" ] && TRY_ARGS+=(--server-command "$INPUT_SERVER_COMMAND")
          [ -n "$INPUT_CONFIG_FILE" ] && TRY_ARGS+=(--config "$INPUT_CONFIG_FILE")
          [ -n "$INPUT_TRY_SUITE" ] && TRY_ARGS+=(--suite "$INPUT_TRY_SUITE")
          mcp-test "${TRY_ARGS[@]}"
          EXIT_CODE=$?
        else
          ARGS=(--transport "$INPUT_TRANSPORT" --report-format "$FMT" --report-output "$OUT")
          [ -n "$INPUT_SERVER_COMMAND" ] && ARGS+=(--server-command "$INPUT_SERVER_COMMAND")
          [ -n "$INPUT_CONFIG_FILE" ] && ARGS+=(--config "$INPUT_CONFIG_FILE")
          if [ -n "$INPUT_SARIF_OUTPUT" ]; then
            ARGS+=(--sarif-output "$INPUT_SARIF_OUTPUT")
          else
            ARGS+=(--sarif-output "mcp-security.sarif")
          fi
          [ "$INPUT_PR_COMMENT" = "true" ] && ARGS+=(--pr-summary-output "mcp-pr-summary.md")
          ARGS+=("$INPUT_TEST_DIRECTORY")
          mcp-test "${ARGS[@]}"
          EXIT_CODE=$?
        fi

        LEVEL="None"
        LEVEL_NUM="-1"
        if [ -f "$JSON_REPORT" ]; then
          LEVEL=$(python -c "import json; d=json.load(open('$JSON_REPORT',encoding='utf-8')); c=(d.get('unified_summary') or {}).get('conformance') or d.get('conformance') or {}; print(c.get('name') or 'None')")
          LEVEL_NUM=$(python -c "import json; d=json.load(open('$JSON_REPORT',encoding='utf-8')); c=(d.get('unified_summary') or {}).get('conformance') or d.get('conformance') or {}; print(c.get('level', -1))")
        fi
        echo "conformance-level=$LEVEL" >> "$GITHUB_OUTPUT"
        echo "conformance-level-num=$LEVEL_NUM" >> "$GITHUB_OUTPUT"
        echo "Conformance: $LEVEL (level $LEVEL_NUM)"

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "test-result=pass" >> "$GITHUB_OUTPUT"
        else
          echo "test-result=fail" >> "$GITHUB_OUTPUT"
        fi
        exit "$EXIT_CODE"

    - name: Upload JSON report (conformance)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: mcp-test-json
        path: mcp-test-report.json
        if-no-files-found: ignore

    - name: Upload SARIF for code scanning
      if: always() && inputs.try-mode != 'true'
      uses: github/codeql-action/upload-sarif@main
      with:
        sarif_file: ${{ inputs.sarif-output != '' && inputs.sarif-output || 'mcp-security.sarif' }}
        category: mcp-test-harness
      continue-on-error: true

    - name: Post PR summary comment
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
      with:
        script: |
          const fs = require('fs');
          const path = 'mcp-pr-summary.md';
          let body = '';
          if (fs.existsSync(path)) {
            body = fs.readFileSync(path, 'utf8');
          } else if (fs.existsSync('mcp-test-report.json')) {
            const d = JSON.parse(fs.readFileSync('mcp-test-report.json', 'utf8'));
            const c = (d.unified_summary || {}).conformance || d.conformance || {};
            body = `## MCP Test Harness — Conformance\n\n**Level:** ${c.name || 'None'} (${c.level ?? '—'})\n`;
            if (c.badge && c.badge.markdown) body += `\n${c.badge.markdown}\n`;
          } else {
            core.info('No PR summary or JSON report; skipping comment.');
            return;
          }
          const marker = '<!-- mcp-test-harness-summary -->';
          const fullBody = marker + '\n' + body;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body: fullBody,
            });
          }
