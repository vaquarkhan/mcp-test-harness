name: "MCP Test Harness"
description: "Run MCP server tests using the mcp-test-harness framework"

inputs:
  server-command:
    description: "Shell command to start the MCP server under test"
    required: false
    default: ""
  transport:
    description: "Transport type: stdio, sse, or http"
    required: false
    default: "stdio"
  test-directory:
    description: "Path to the test directory or file"
    required: false
    default: "tests/"
  config-file:
    description: "Path to mcp-test.yaml or mcp-test.toml config file"
    required: false
    default: ""
  report-format:
    description: "Report output format: json, junit, html, or sarif"
    required: false
    default: "junit"
  harness-version:
    description: "Version of mcp-test-harness to install (e.g. 1.2.0). Defaults to latest."
    required: false
    default: "latest"
  sarif-output:
    description: "Optional path for SARIF security findings (e.g. mcp-security.sarif). Emitted alongside the primary report."
    required: false
    default: ""
  pr-comment:
    description: "Post unified run summary as a pull-request comment (requires pull_request event)"
    required: false
    default: "false"

outputs:
  test-result:
    description: "Test result: pass or fail"
    value: ${{ steps.run-tests.outputs.test-result }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install MCP Test Harness
      shell: bash
      env:
        HARNESS_VERSION: ${{ inputs.harness-version }}
      run: |
        python -m pip install --upgrade pip
        if [ "$HARNESS_VERSION" = "latest" ]; then
          pip install mcp-test-harness
        else
          pip install "mcp-test-harness==$HARNESS_VERSION"
        fi

    - name: Run MCP tests
      id: run-tests
      shell: bash
      env:
        INPUT_SERVER_COMMAND: ${{ inputs.server-command }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_TEST_DIRECTORY: ${{ inputs.test-directory }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
      run: |
        set +e

        ARGS=()

        if [ -n "$INPUT_SERVER_COMMAND" ]; then
          ARGS+=(--server-command "$INPUT_SERVER_COMMAND")
        fi

        ARGS+=(--transport "$INPUT_TRANSPORT")

        if [ -n "$INPUT_CONFIG_FILE" ]; then
          ARGS+=(--config "$INPUT_CONFIG_FILE")
        fi

        ARGS+=(--report-format "$INPUT_REPORT_FORMAT")

        if [ "$INPUT_REPORT_FORMAT" = "junit" ]; then
          ARGS+=(--report-output "mcp-test-report.xml")
        elif [ "$INPUT_REPORT_FORMAT" = "sarif" ]; then
          ARGS+=(--report-output "mcp-security.sarif")
        else
          ARGS+=(--report-output "mcp-test-report.json")
        fi

        if [ -n "$INPUT_SARIF_OUTPUT" ]; then
          ARGS+=(--sarif-output "$INPUT_SARIF_OUTPUT")
        elif [ "$INPUT_REPORT_FORMAT" != "sarif" ]; then
          ARGS+=(--sarif-output "mcp-security.sarif")
        fi

        if [ "$INPUT_PR_COMMENT" = "true" ]; then
          ARGS+=(--pr-summary-output "mcp-pr-summary.md")
        fi

        ARGS+=("$INPUT_TEST_DIRECTORY")

        mcp-test "${ARGS[@]}"
        EXIT_CODE=$?

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "test-result=pass" >> "$GITHUB_OUTPUT"
        else
          echo "test-result=fail" >> "$GITHUB_OUTPUT"
        fi

        exit "$EXIT_CODE"

    - name: Upload JUnit XML report
      if: always() && inputs.report-format == 'junit'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: mcp-test-report
        path: mcp-test-report.xml
        if-no-files-found: ignore

    - name: Upload SARIF for code scanning
      if: always() && (inputs.sarif-output != '' || inputs.report-format != 'sarif')
      uses: github/codeql-action/upload-sarif@main
      with:
        sarif_file: ${{ inputs.sarif-output != '' && inputs.sarif-output || 'mcp-security.sarif' }}
        category: mcp-test-harness
      continue-on-error: true

    - name: Post PR summary comment
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@ed597411d8f924073f0dfc12c67d847b6c090e5a  # v8.0.0
      with:
        script: |
          const fs = require('fs');
          const path = 'mcp-pr-summary.md';
          if (!fs.existsSync(path)) {
            core.info('No PR summary file found; skipping comment.');
            return;
          }
          const body = fs.readFileSync(path, 'utf8');
          const marker = '<!-- mcp-test-harness-summary -->';
          const fullBody = marker + '\n' + body;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body: fullBody,
            });
          }
