<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="MCP Test Harness dual mode: stateful session vs stateless HTTP">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="stateful" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="stateless" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)" rx="16"/>
  <text x="600" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Dual mode - stateful session vs stateless Streamable HTTP (SEP-2575)</text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Both paths coexist; stateful flows unchanged. RFC-006 adds HTTP certification + hyperscale load.</text>

  <!-- Stateful column -->
  <rect x="40" y="100" width="540" height="420" rx="14" fill="#1e293b" stroke="url(#stateful)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="136" text-anchor="middle" fill="#e0e7ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Stateful (existing)</text>
  <text x="310" y="160" text-anchor="middle" fill="#a5b4fc" font-family="system-ui,sans-serif" font-size="11">stdio, SSE, session HTTP, MCP SDK</text>

  <rect x="70" y="180" width="200" height="52" rx="8" fill="#312e81" stroke="#6366f1"/>
  <text x="170" y="212" text-anchor="middle" fill="#e0e7ff" font-family="system-ui,sans-serif" font-size="12" font-weight="600">initialize handshake</text>

  <rect x="300" y="180" width="240" height="52" rx="8" fill="#312e81" stroke="#6366f1"/>
  <text x="420" y="204" text-anchor="middle" fill="#e0e7ff" font-family="system-ui,sans-serif" font-size="12" font-weight="600">mcp_server fixture</text>
  <text x="420" y="220" text-anchor="middle" fill="#a5b4fc" font-family="system-ui,sans-serif" font-size="10">ClientSession + session id</text>

  <line x1="270" y1="206" x2="298" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="260" width="470" height="72" rx="10" fill="#334155"/>
  <text x="305" y="288" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">assert_tool_call, assert_throughput, assert_load_phases, assert_latency</text>
  <text x="305" y="312" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">RFC-002: mcp-test try - Boot - Protocol - Resilient badge</text>

  <rect x="70" y="360" width="220" height="44" rx="8" fill="#4338ca"/>
  <text x="180" y="388" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">mcp-test try</text>
  <rect x="320" y="360" width="220" height="44" rx="8" fill="#4338ca"/>
  <text x="430" y="388" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">pytest + fixtures</text>

  <!-- Stateless column -->
  <rect x="620" y="100" width="540" height="420" rx="14" fill="#1e293b" stroke="url(#stateless)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="136" text-anchor="middle" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Stateless (RFC-006, 2026-07-28)</text>
  <text x="890" y="160" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="11">Streamable HTTP POST, no initialize, no Mcp-Session-Id</text>

  <rect x="650" y="180" width="220" height="52" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="760" y="204" text-anchor="middle" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="12" font-weight="600">server/discover</text>
  <text x="760" y="220" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10">_meta on every request</text>

  <rect x="900" y="180" width="220" height="52" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="1010" y="204" text-anchor="middle" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="12" font-weight="600">SEP-2243 headers</text>
  <text x="1010" y="220" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10">MCP-Protocol-Version, Mcp-Method, Mcp-Name</text>

  <rect x="650" y="260" width="470" height="72" rx="10" fill="#334155"/>
  <text x="885" y="288" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">assert_stateless_throughput, adversarial conformance gate</text>
  <text x="885" y="312" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">httpx async, protocol-aware RPS / p99 / error percent</text>

  <rect x="650" y="360" width="220" height="44" rx="8" fill="#047857"/>
  <text x="760" y="388" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">conformance stateless</text>
  <rect x="900" y="360" width="220" height="44" rx="8" fill="#047857"/>
  <text x="1010" y="388" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Stateless Compliant badge</text>

  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">docs/TUTORIAL_STATELESS.md, docs/design/RFC-006-stateless-mcp.md</text>
</svg>
